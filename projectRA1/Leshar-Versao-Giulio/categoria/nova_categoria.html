<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar - Categoria de Habilidades</title>
    <link rel="stylesheet" href="../css/categoriaNova.css">
</head>
<body>
    <aside class="sidebar">
        <h1>LESHAR</h1>
        <p class="menu-title"><a href="../home/index.html">Menu Principal</a></p>
        <nav>
            <ul>
                <li><a href="../categoria/index.html">Categorias de Habilidades</a></li>
                <li><a href="../habilidade/index.html">Habilidades</a></li>
                <li><a href="../Perfil/index.html">Perfil</a></li>
                <li><a href="../Aulas/index.html">Aulas</a></li>
            </ul>
        </nav>
    </aside>
    <div class="form-container">
        
        <h1>Criar nova categoria de Habilidades</h1>
        
        <form>
            <div class="form-group">
                <label for="nome">Nome da categoria de Habilidade</label>
                <input type="text" id="nome" name="nome" placeholder="Ex: Música" required>
            </div>
            
            <div class="form-group">
                <label for="prioridade">Nível de Importância</label>
                <input type="range" id="prioridade" name="prioridade" min="1" max="5" value="3">
                </div> 
            
            

            <div class="form-group">
                <label for="dataCriacao">Data de criação</label>
                <input type="date" id="dataCriacao" name="dataCriacao">
            </div>
            
            
        </form>
        <div class="form-group">
            <button id="salvar" type="submit" class="btn-salvar">Salvar Categoria</button>
        </div>  
    </div>
    <script src="../js/categoria/nova_categoria.js"></script>
</body>
</html>
