<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
</head>
<body>
    <div>
        <h1>Editar Dados Pessoais</h1>
        <p>
            <div>
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome">
            </div>
            <div>
                <label for="idade">Idade</label>
                <input type="number" id="idade" name="idade" placeholder="Digite a idade">
            </div>
            <div>
                <label for="biografia">Biografia</label>
                <input type="text" id="biografia" name="biografia" placeholder="Digite a biografia">
            </div>
            <div>
                <button id="salvar" type="button">Salvar Informações</button>
            </div>
        </p>
    </div>
    <script src="../js/editar_perfil.js"></script>
</body>
</html>
