<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Aulas</title>
</head>
<body>
    <div>
        <h1>Avaliar Aulas</h1>
        <p>
            <div>
                <label for="aula">Selecione a Aula</label>
                <select id="aula" name="aula">
                    <option value="" disabled selected>Selecione a aula</option>
                </select>
            </div>
            <div>
                <label for="avaliacao">Avaliacao (0 a 5)</label>
                <input type="number" id="avaliacao" name="avaliacao" min="0" max="5" placeholder="Digite a avaliacao">
            </div>
            <div>
                <label for="comentario">Comentário</label>
                <input type="text" id="comentario" name="comentario" placeholder="Digite seu comentário">
            </div>
            <div>
                <label for="mentor">Mentor</label>
                <input type="text" id="mentor" name="mentor" placeholder="Digite o nome do mentor">
            </div>
            <div>
                <button id="salvar" type="button">Avaliar Aula</button>
            </div>
    </div>
    <script src="../js/avaliacao_aula.js"></script>
</body>
</html>
