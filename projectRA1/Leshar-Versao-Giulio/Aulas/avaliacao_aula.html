<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliar Aulas</title>
    <link rel="stylesheet" href="../css/avaliacaoAula.css">
</head>
<body>
    <aside class="sidebar">
        <h1>LESHAR</h1>
        <p class="menu-title"><a href="../home/index.html">Menu Principal</a></p>
        <nav>
            <ul>
                <li><a href="../categoria/index.html">Categorias de Habilidades</a></li>
                <li><a href="../habilidade/index.html">Habilidades</a></li>
                <li><a href="../Perfil/index.html">Perfil</a></li>
                <li><a href="../Aulas/index.html">Aulas</a></li>
            </ul>
        </nav>
    </aside>
    <div class="form-container">
        
        <h1>Avaliar Aulas</h1>
        
        <form>
            <div class="form-group">
                <label for="aula">Selecione a Aula</label>
                <select id="aula" name="aula" required>
                    <option value="" disabled selected>Selecione a aula</option>
                    </select>
            </div>
            
            <div class="form-group">
                <label for="avaliacao">Avaliação (0 a 5)</label>
                <input type="number" id="avaliacao" name="avaliacao" min="0" max="5" placeholder="Digite a avaliação" required>
            </div>
            
            <div class="form-group">
                <label for="comentario">Comentário</label>
                <textarea id="comentario" name="comentario" rows="3" placeholder="Digite seu comentário"></textarea>
            </div>
            
            <div class="form-group">
                <label for="formato">Formato</label>
                <select name="formato" id="formato">
                    <option value="Presencial">Presencial</option>
                    <option value="Online">Online</option>
                </select>
            </div>
            
            

            <div class="form-group">
                <label for="mentor">Mentor</label>
                <input type="text" id="mentor" name="mentor" placeholder="Digite o nome do mentor" required>
            </div>
            
            
        </form>
        <div class="form-group">
                <button id="salvar" type="submit" class="btn-salvar">Avaliar Aula</button>
            </div>
    </div>
    <script src="../js/avaliacao_aula.js"></script>
</body>
</html>
