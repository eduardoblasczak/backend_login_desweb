<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Aula</title>
</head>
<body>
    <div>
        <h1>Criar Nova Aula</h1>
        <p>
            <div>
                <label for="titulo">Titulo da Aula</label>
                <input type="text" id="titulo" name="titulo" placeholder="Digite o titulo da aula">
            </div>
            <div>
                <label for="descricao">Descrição</label>
                <input type="text" id="descricao" name="descricao" placeholder="Digite a descrição da aula">
            </div>
            <div>
                <label for="data">Data</label>
                <input type="date" id="data" name="data">
            </div>
            <div>
                <label for="horario">Horário</label>
                <input type="time" id="horario" name="horario">
            </div>
            <div>
                <button id="salvar" type="button">Salvar Aula</button>
            </div>
        </p>
    </div>
    <script src="../js/nova_aula.js"></script>
    
</body>
</html>
